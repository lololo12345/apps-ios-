name: iOS CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

# Queue new pushes instead of cancelling a run that is already testing.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only the apps whose folder changed are built (tools/ci_plan.py). Changing tools/ or this workflow
  # rebuilds everything and also generates and tests "Plantilla" from tools/new_ios_app.py.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_plan.py >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    name: ${{ matrix.app }}
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # One folder per app: <App>/<App>.xcodeproj with targets <App>, <App>Tests and <App>UITests.
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate the template app
        if: matrix.app == 'Plantilla'
        working-directory: .
        run: |
          python3 tools/new_ios_app.py Plantilla app.example.plantilla --display "Plantilla" \
            --summary "Comprobación automática del generador de apps." --kit --widget --no-register

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Pick simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS" in k), reverse=True)
          for preferred in ("iPhone 17 Pro", "iPhone 17", "iPhone"):
              for runtime in runtimes:
                  for device in data[runtime]:
                      if device["name"].startswith(preferred):
                          print(device["udid"]); sys.exit(0)
          ')
          echo "Using simulator $SIM_ID"
          xcrun simctl list devices | grep "$SIM_ID"
          echo "TEST_DESTINATION=id=$SIM_ID" >> "$GITHUB_ENV"

      - name: Build (app + tests)
        id: build
        run: |
          set +e
          xcodebuild build-for-testing \
            -project "$APP.xcodeproj" -scheme "$APP" \
            -destination "$TEST_DESTINATION" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          echo "::group::Diagnostics"
          grep -E "(error|warning):" build.log | grep -v "^ld: warning" | sort -u | head -150
          echo "::endgroup::"
          if [ $status -ne 0 ]; then
            echo "== Failure context =="
            grep -n -E "error|Stack dump|Segmentation|signal [0-9]|Assertion|PLEASE|fatal|unable to type-check|Command .* failed" build.log | cut -c1-600 | head -80
            line=$(grep -n "Stack dump" build.log | head -1 | cut -d: -f1)
            if [ -n "$line" ]; then
              echo "== Compiler crash =="
              sed -n "$((line-25)),$((line+12))p" build.log | cut -c1-900
              grep -n -i -E "while |LLVM ERROR|in function|SIL|IRGen|emitting" build.log | cut -c1-900 | head -40
            fi
          fi
          echo "Warnings in project sources: $(grep -E "/${APP}(Tests|UITests)?/.*warning:" build.log | sort -u | wc -l)"
          tail -15 build.log
          exit $status

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$APP.xcodeproj" -scheme "$APP" \
            -destination "$TEST_DESTINATION" -derivedDataPath DerivedData \
            -only-testing:"${APP}Tests" -resultBundlePath Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test (Case|Suite|run)|✔|✘|passed|failed|error:|Executed" | tail -150

      - name: Warm up simulator (first app launch is slow)
        if: always() && steps.build.outcome == 'success'
        run: |
          SIM_ID="${TEST_DESTINATION#id=}"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/$APP.app"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          xcrun simctl install "$SIM_ID" "$APP_PATH"
          xcrun simctl launch "$SIM_ID" "$BUNDLE" -uiTesting || true
          sleep 8
          xcrun simctl terminate "$SIM_ID" "$BUNDLE" || true

      - name: UI tests (with screenshots)
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$APP.xcodeproj" -scheme "$APP" \
            -destination "$TEST_DESTINATION" -derivedDataPath DerivedData \
            -only-testing:"${APP}UITests" -resultBundlePath UI.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|passed|failed|error:|Executed|measured|XCTAssert" | tail -120

      - name: Test summaries
        if: always()
        run: |
          for bundle in Unit.xcresult UI.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" --compact > "$bundle.json" || continue
            echo "== $bundle =="
            head -c 4000 "$bundle.json"; echo
          done
          python3 - <<'PY'
          import json, os
          lines = [f"### {os.environ['APP']}", "", "| Tests | ✔ | ✘ |", "|---|---|---|"]
          failures = []
          for label, path in (("Lógica", "Unit.xcresult.json"), ("Interfaz", "UI.xcresult.json")):
              if not os.path.exists(path):
                  lines.append(f"| {label} | — | no se ejecutaron |")
                  continue
              data = json.load(open(path))
              lines.append(f"| {label} | {data.get('passedTests', 0)} | {data.get('failedTests', 0)} |")
              for failure in data.get("testFailures", [])[:8]:
                  failures.append(f"- `{failure.get('testName', '?')}`: {failure.get('failureText', '').strip()[:300]}")
          if failures:
              lines += ["", "**Fallos**", *failures]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n\n")
          PY

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p raw screenshots
          if [ -d UI.xcresult ]; then xcrun xcresulttool export attachments --path UI.xcresult --output-path raw || true; fi
          python3 - <<'PY'
          import json, os, shutil, subprocess
          manifest = os.path.join("raw", "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                      src = os.path.join("raw", item["exportedFileName"])
                      base = name.split("_")[0].replace(" ", "-")
                      dst = os.path.join("screenshots", base + ".jpg")
                      if src.endswith(".txt"):
                          shutil.copy(src, os.path.join("screenshots", base.replace("`", "").replace('"', "") + ".txt"))
                      elif src.endswith(".png"):
                          subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "72", "-Z", "1100", src, "--out", dst], capture_output=True)
          print("\n".join(sorted(os.listdir("screenshots"))))
          PY

      - name: Package unsigned IPA
        id: ipa
        if: steps.build.outcome == 'success' && matrix.app != 'Plantilla'
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$APP.xcodeproj" -scheme "$APP" -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 \
            | grep -E "error:|warning: .*${APP}/|BUILD (SUCCEEDED|FAILED)" | tail -40
          APP_PATH="DerivedDataDevice/Build/Products/Release-iphoneos/$APP.app"
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload && cp -R "$APP_PATH" Payload/
          zip -qry "$APP.ipa" Payload
          ls -lh "$APP.ipa"
          echo "IPA: $(du -h "$APP.ipa" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"

      - uses: actions/upload-artifact@v4
        if: steps.ipa.outcome == 'success'
        with:
          name: ipa-${{ matrix.app }}
          path: ${{ matrix.app }}/${{ matrix.app }}.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.app }}
          path: ${{ matrix.app }}/build.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.app }}
          path: ${{ matrix.app }}/screenshots
          retention-days: 14
