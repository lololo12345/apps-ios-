name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
    paths: [ "RondaAndroid/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "RondaAndroid/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ronda-android:
    name: RondaAndroid
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: RondaAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + UI tests (Robolectric, with screenshots)
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          tests = failures = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="\d+" failures="(\d+)" errors="(\d+)"', open(path).read())
              tests += int(m.group(1)); failures += int(m.group(2)) + int(m.group(3))
          print(f"{tests} tests, {failures} failures")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-RondaAndroid
          path: RondaAndroid/app/build/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-RondaAndroid
          path: RondaAndroid/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-RondaAndroid
          path: RondaAndroid/app/build/reports
