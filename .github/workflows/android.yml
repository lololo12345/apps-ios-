name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the <App>Android folders that changed are built (tools/ci_plan.py).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_plan.py >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + UI tests (Robolectric, with screenshots)
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          tests = failures = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="\d+" failures="(\d+)" errors="(\d+)"', open(path).read())
              tests += int(m.group(1)); failures += int(m.group(2)) + int(m.group(3))
          print(f"{tests} tests, {failures} failures")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/reports
