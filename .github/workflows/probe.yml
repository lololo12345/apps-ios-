name: Probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/workflows/probe.yml" ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - run: ls /Applications | grep -i xcode; xcodebuild -version; xcrun simctl list runtimes; xcrun simctl list devices available | head -40; sw_vers
